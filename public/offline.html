<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174c4f" />
    <title>Student Productivity Hub | Offline</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: #152126; background: #f7f3ec; }
      main { width: min(34rem, calc(100% - 2rem)); padding: 2rem; border-top: 5px solid #174c4f; background: #fffdf8; box-shadow: 0 16px 38px rgba(23, 51, 61, 0.1); }
      h1 { margin: 0 0 0.75rem; font-family: Georgia, serif; }
      p { color: #526167; line-height: 1.55; }
      button { border: 0; border-radius: 7px; padding: 0.75rem 1rem; color: #fff; font-weight: 700; background: #174c4f; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Student Productivity Hub will be ready when your connection returns. Your device has not been asked to change or upload anything.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
